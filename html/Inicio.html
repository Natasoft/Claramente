<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesiòn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabriela&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../CSS/loginestilo.css">
</head>
<body>
    <section>
        <div class="Inicio">
             <form class="formlogin" method="get" id="formlogin"> 
                <div class="logo">
                <img src="../Imagenes/LOGO CLARAMENTE.png" alt="LOGO">
               </div> 
               <h2>Iniciar Sesiòn</h2>
               <div class="form-floating mb-3">
                <input type="email" class="form-control" id="correo" required value="" placeholder="Correo electrònico">
                <label for="correo">Correo electrònico</label>
                </div>
                <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" required value="" placeholder="Contraseña">
                <label for="password">Contraseña</label>
                </div>
                <button type="submit" id="save-btn" name="save-btn" class="btn btn-outline-info">Iniciar sesiòn</button>
                <a href="" target="_blank" rel="noopener noreferrer">¿Olvidaste tu contraseña?</a>
            </form>
        </div>
    </section>
    <script src="../JS/main.js" type="module"></script>
</body>
</html>
