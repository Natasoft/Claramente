<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/loginestilo.css">
</head>

<body>
    <section>
        <div class="Registro">
            <form id="formregistro" novalidate>
                <div class="logo">
                    <img src="../Imagenes/LOGO CLARAMENTE.png" alt="LOGO">
                </div>
                <h2>Registrarse</h2>

                <!-- Aquí se muestran los avisos (errores y confirmación) -->
                <div id="registro-mensaje" class="alert d-none" role="alert"></div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="nombres" maxlength="30" autocomplete="given-name" placeholder="Nombres" required>
                    <label for="nombres">Nombres</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="apellidos" maxlength="30" autocomplete="family-name" placeholder="Apellidos" required>
                    <label for="apellidos">Apellidos</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="correo" maxlength="100" autocomplete="email" placeholder="Correo electrónico" required>
                    <label for="correo">Correo electrónico</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" autocomplete="new-password" placeholder="Contraseña" required>
                    <label for="password">Contraseña</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="confirmar" autocomplete="new-password" placeholder="Confirmar contraseña" required>
                    <label for="confirmar">Confirmar contraseña</label>
                </div>
                <div class="form-text mb-3">La contraseña debe tener al menos 8 caracteres.</div>

                <!-- REVISAR EL TEXTO con quien corresponda. Si quitas esta casilla, pon
                     EXIGIR_AUTORIZACION = false en backend/vista_registro/registroController.php -->
                <div class="form-check mb-3 text-start">
                    <input class="form-check-input" type="checkbox" id="autorizacion" required>
                    <label class="form-check-label" for="autorizacion">
                        Autorizo el tratamiento de mis datos personales, incluida la información sobre mi estado
                        emocional, para el funcionamiento de la plataforma.
                    </label>
                </div>

                <button type="submit" id="registro-btn" class="btn btn-outline-info">Crear cuenta</button>
                <p class="registrate">¿Ya tienes cuenta? <a href="inicio.html">Inicia sesión</a></p>
            </form>
        </div>
    </section>

    <script src="../JS/registro.js" type="module"></script>

</body>

</html>
