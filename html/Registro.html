<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/loginestilo.css">
</head>

<body>
    <section>
        <div class="Registro">
            <form action="">
                <div class="logo">
                    <img src="../Imagenes/LOGO CLARAMENTE.png" alt="LOGO">
                </div>
                <h2>Registrarse</h2>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput" placeholder="Nombre completo">
                    <label for="floatingNombre">Nombre completo</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="floatingInput" placeholder="Correo electrònico">
                    <label for="floatingCorreo">Correo electrònico</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="floatingPassword" placeholder="Contraseña">
                    <label for="floatingPassword">Contraseña</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="floatingPassword"
                        placeholder="Confirmar contraseña">
                    <label for="floatingConfirmPassword">Confirmar contraseña</label>
                </div>
                <button type="submit" class="btn btn-outline-info">Crear cuenta</button>
            </form>
        </div>
        </div>
    </section>

</body>

</html>
